name: seal-build
# Build-and-pack only: the test suite runs on Travis (.travis.yml).
on:
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Package xmlunit-core
        run: mvn -B -V package -DskipTests -pl xmlunit-core
      - uses: actions/upload-artifact@v4
        with:
          name: xmlunit-core-jars
          path: |
            xmlunit-core/target/xmlunit-core-2.5.1.jar
            xmlunit-core/target/xmlunit-core-2.5.1-tests.jar
          if-no-files-found: error
